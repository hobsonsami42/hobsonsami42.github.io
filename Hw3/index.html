<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sami’s Multiverse Character Finder</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

<div class="container">
    <header class="text-center mb-4">
        <h1>Sami's Multiverse Character Finder</h1>
        <p class="subtitle">
            Explore the Rick and Morty universe and find your favorite characters!
        </p>
    </header>

    <section class="search-box">
        <form id="characterForm">
            <label for="name">Character Name</label>
            <input type="text" id="name" name="name" placeholder="Try Rick, Morty..."/>

            <label for="species">Species</label>
            <select id="species">
                <option value="">Any Species</option>
                <option value="Human">Human</option>
                <option value="Alien">Alien</option>
                <option value="Robot">Robot</option>
                <option value="Animal">Animal</option>
                <option value="Humanoid">Humanoid</option>
            </select>

            <button type="submit">Search the Multiverse</button>
        </form>

        <p id="message" class="message"></p>
    </section>

    <section id="results" class="results"></section>
</div>

<footer class="text-center mt-3 small">
    CST336 Internet Programming. 2026&copy; Hobson <br>
</footer>

<script src="js/script.js"></script>
</body>
</html>
